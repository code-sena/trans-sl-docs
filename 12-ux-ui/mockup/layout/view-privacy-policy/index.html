<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="../_shared/theme.css">
<script src="../_shared/theme-boot.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Nunito+Sans:opsz,wght@6..12,400;6..12,600;6..12,700;6..12,800;6..12,900&display=swap" rel="stylesheet">
<script src="https://unpkg.com/lucide@latest/dist/umd/lucide.min.js"></script>
<style>
  * { box-sizing: border-box; }
  body { margin: 0; font-family: 'Nunito Sans', system-ui, sans-serif; color: #1F2937; background: #FFFFFF; -webkit-font-smoothing: antialiased; }
  a { color: #9B77E6; text-decoration: none; }
  ::selection { background: #EDE9FE; }
  .lucide { stroke-width: 2; }
</style>
</helmet>
<div style="width:100%; background:#FFFFFF;">

  <section style="background:linear-gradient(160deg,#FBFAFE 0%,#F5F2FC 100%);">
    <div style="max-width:820px; margin:0 auto; padding:44px 40px 30px;">
      <a href="javascript:history.back()" style="display:inline-flex; align-items:center; gap:8px; font-size:14px; font-weight:700; color:#7E5AD0; margin-bottom:16px;"><i data-lucide="arrow-left" style="width:17px; height:17px;"></i>Volver</a>
      <div style="display:inline-flex; align-items:center; gap:9px; background:#EFEBFD; border-radius:999px; padding:8px 16px 8px 13px; margin-bottom:16px;">
        <i data-lucide="shield-check" style="width:15px; height:15px; color:#9B77E6;"></i>
        <span style="font-size:13px; font-weight:700; color:#7E5AD0;">Legal</span>
      </div>
      <h1 style="font-size:40px; line-height:1.1; font-weight:800; letter-spacing:-0.6px; margin:0 0 8px; color:#1F2937;">Política de Privacidad</h1>
      <p style="font-size:14px; color:#9CA3AF; margin:0; font-weight:600;">Última actualización: 4 de agosto de 2026</p>
    </div>
  </section>

  <section style="background:#fff;">
    <div style="max-width:820px; margin:0 auto; padding:34px 40px 72px;">
      <sc-for list="{{ sections }}" as="s" hint-placeholder-count="6">
        <div style="margin-bottom:30px;">
          <div style="display:flex; align-items:center; gap:12px; margin-bottom:12px;">
            <span style="width:34px; height:34px; border-radius:10px; background:#EDE9FE; display:flex; align-items:center; justify-content:center;"><i data-lucide="{{ s.icon }}" style="width:18px; height:18px; color:#9B77E6;"></i></span>
            <h2 style="font-size:20px; font-weight:800; color:#1F2937; margin:0; letter-spacing:-0.3px;">{{ s.title }}</h2>
          </div>
          <p style="font-size:15px; line-height:1.7; color:#5B5470; margin:0; padding-left:46px;">{{ s.body }}</p>
        </div>
      </sc-for>
      <div style="margin-top:12px; padding:22px 24px; background:#FBFAFE; border:1px solid #F1EEF9; border-radius:16px; font-size:14px; line-height:1.6; color:#6B7280;">
        Para ejercer tus derechos sobre tus datos o resolver dudas, contáctanos en <a href="#" style="font-weight:700;">hola@traducesena.com</a>. Consulta también nuestros <a href="../view-terms/index.html" style="font-weight:700;">Términos y Condiciones</a>.
      </div>
    </div>
  </section>

  <dc-import name="SiteFooter" hint-size="100%,360px"></dc-import>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:820,&quot;height&quot;:900}}">
class Component extends DCLogic {
  renderVals() {
    return {
      sections: [
        { icon: "database", title: "Datos que recopilamos", body: "Recopilamos tu nombre y correo al registrarte, y datos de uso como traducciones realizadas y progreso de aprendizaje, para ofrecerte el servicio y mejorar tu experiencia." },
        { icon: "camera", title: "Cámara y reconocimiento", body: "El reconocimiento de señas se procesa en tiempo real para generar la traducción. No almacenamos el video de tu cámara; solo se conserva el texto resultante si decides guardarlo en tu historial." },
        { icon: "target", title: "Uso de la información", body: "Usamos tus datos para autenticarte, personalizar la app (idioma, tema, color), mostrar tus estadísticas y mantener tu historial de traducciones. No vendemos tus datos a terceros." },
        { icon: "lock", title: "Seguridad", body: "Aplicamos medidas razonables para proteger tu información. Aun así, ningún sistema es completamente infalible, por lo que te recomendamos usar una contraseña fuerte y única." },
        { icon: "user-check", title: "Tus derechos", body: "Puedes acceder, corregir o eliminar tus datos en cualquier momento desde tu Perfil, incluyendo la opción de eliminar tu cuenta de forma permanente." },
        { icon: "refresh-cw", title: "Cambios en esta política", body: "Podemos actualizar esta política ocasionalmente. Publicaremos la versión vigente en esta página junto con su fecha de última actualización." }
      ]
    };
  }
  componentDidMount() { this._ensure(); }
  componentDidUpdate() { this._icons(); }
  _icons() { if (window.lucide) { cancelAnimationFrame(this._raf); this._raf = requestAnimationFrame(() => window.lucide.createIcons()); } else this._ensure(); }
  _ensure() { let n=0; clearInterval(this._t); this._t=setInterval(()=>{ if(window.lucide) window.lucide.createIcons(); const left=document.querySelectorAll('i[data-lucide]').length; if(left===0 || ++n>=120) clearInterval(this._t); },100); }
  componentWillUnmount() { clearInterval(this._t); cancelAnimationFrame(this._raf); }
}
</script>
</body>
